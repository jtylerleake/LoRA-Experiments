experiment: exp3_method_comparison
description: >
  Same model and task, compare full fine-tuning, bottleneck adapters,
  prefix tuning, and LoRA side by side. Full fine-tuning is kept here
  (unlike experiments 1/1a/2) since this experiment's whole point is a
  direct, controlled comparison against it.
model:
  name: qwen2.5-0.5b-instruct
tasks: [sst2]
output_subdir: exp3_method_comparison
seed: 42
training:
  epochs: 1
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  max_seq_length: 512
  # sst2 only ever outputs one word.
  max_new_tokens: 8
  eval_samples: 50
  max_train_samples: 8000
methods:
  - type: full_ft
    # Full fine-tuning needs a much smaller LR than the other methods to stay stable.
    learning_rate: 2.0e-5
  - type: adapters
    bottleneck_size: 64
  - type: prefix_tuning
    num_virtual_tokens: 20
  - type: lora
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj]
