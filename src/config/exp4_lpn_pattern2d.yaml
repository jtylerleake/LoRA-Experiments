experiment: exp4_lpn_pattern2d
description: >
  Test-time adaptation of a pretrained Latent Program Network (LPN) on its
  Pattern-2D task. Compares three conditions on the same fixed, seeded set
  of tasks: "mean" (no adaptation), "gradient_ascent" (the paper's own
  search over the 2D latent vector), and "lora_ascent" (ours -- a per-task
  LoRA adapter fit on the decoder's MLP weights instead of the latent).
  Not run through run_experiment.py / ExperimentConfig -- see
  scripts/run_exp4.py and src/lpn_exp/.
checkpoint_repo: clement-bonnet/lpn-2d
checkpoint_name: "quiet-thunder-789--checkpoint:v0"
output_subdir: exp4_lpn_pattern2d
seed: 42
num_eval_tasks: 96  # matches the checkpoint's own eval block (length: 96)
conditions: [mean, gradient_ascent, lora_ascent]
task_generator:
  num_pairs: 4
  num_rows: 4
  num_cols: 4
  pattern_size: 2
gradient_ascent:
  num_steps: 10
  lr: 0.1
lora:
  rank: 4
  scale: 1.0
  num_steps: 10
  lr: 0.1
