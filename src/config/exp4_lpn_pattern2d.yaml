experiment: exp4_lpn_pattern2d
description: >
  Test-time adaptation of a pretrained Latent Program Network (LPN) on its
  Pattern-2D task. Compares five conditions on the same fixed, seeded set
  of tasks: "mean" (no adaptation), "gradient_ascent" (the paper's own
  search over the 2D latent vector), and three LoRA-ascent variants (ours
  -- a per-task LoRA adapter fit on MLP weights instead of the latent):
  "lora_ascent_decoder" (decoder only), "lora_ascent_encoder" (encoder
  only), and "lora_ascent_encoder_decoder" (both together).
  Not run through run_experiment.py / ExperimentConfig -- see
  scripts/run_exp4.py and src/lpn_exp/.
checkpoint_repo: clement-bonnet/lpn-2d
checkpoint_name: "quiet-thunder-789--checkpoint:v0"
output_subdir: exp4_lpn_pattern2d
seed: 42
num_eval_tasks: 96  # matches the checkpoint's own eval block (length: 96)
batch_size: 16  # tasks per jitted call (speed only, not results)
conditions:
  - mean
  - gradient_ascent
  - lora_ascent_decoder
  - lora_ascent_encoder
  - lora_ascent_encoder_decoder
task_generator:
  num_pairs: 4
  num_rows: 4
  num_cols: 4
  pattern_size: 2
gradient_ascent:
  num_steps: 10
lora:  # shared by all three lora_ascent_* conditions
  rank: 4
  scale: 1.0
  num_steps: 10
# Per-condition learning rates. 0.1 is the paper's own gradient-ascent lr;
# the real runs override these with scripts/tune_exp4_lr.py's tuned values
# (run_exp4.py --learning-rates <sweep dir>/best_learning_rates.json).
learning_rates:
  gradient_ascent: 0.1
  lora_ascent_decoder: 0.1
  lora_ascent_encoder: 0.1
  lora_ascent_encoder_decoder: 0.1
lr_sweep:
  seed: 1  # must differ from `seed`: tuning never sees the evaluation tasks
  num_tasks: 64
  learning_rates: [0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
