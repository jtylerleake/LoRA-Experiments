experiment: exp1a_rank_ablation_mini_1.5b
description: >
  Same tiny smoke-test as experiment_1a_rank_ablation_mini.yaml (3 tasks x
  6 LoRA ranks, ~32 training examples, 1 epoch per run), but on
  qwen2.5-1.5b-instruct instead of the 0.5b model. Purpose: get a real
  elapsed_seconds data point per run at 1.5b scale (recorded in
  metrics.jsonl) to calibrate expected runtime before committing to the
  full 18-run experiment_1a sweep at this model size -- see the "Model
  size sweet spot" discussion in project notes. Accuracy numbers from this
  config are meaningless (barely any training data) — only the timing and
  wiring matter here.
model:
  name: qwen2.5-1.5b-instruct
tasks:
  - sst2
  - rte
  - gsm8k
output_subdir: exp1a_rank_ablation_mini_1.5b
seed: 42
training:
  epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  max_seq_length: 256
  max_new_tokens: 64
  eval_samples: 8
  max_train_samples: 32
methods:
  - type: lora
    rank: 1
    alpha: 2
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 2
    alpha: 4
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 4
    alpha: 8
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 16
    alpha: 32
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 64
    alpha: 128
    target_modules: [q_proj, v_proj]
