experiment: exp4_ladder_L3_pattern3x3_corner
description: >
  Experiment 4 benchmark ladder, L3: 3x3 patterns, per-task anchor corner.
  3x3 patterns where the marker pixel marks a per-task corner of the
  pattern (not always its top-left): the placement rule itself varies by
  task, not just the colors. Same checkpoint, conditions, steps, LoRA
  rank, and sweep grid as exp4_lpn_pattern2d.yaml (level L0); only the
  tasks differ (src/lpn_exp/task_families.py). Every round is well-posed
  (the exact solver recovers it from its context) and, for the pattern
  families, clean by construction.
checkpoint_repo: clement-bonnet/lpn-2d
checkpoint_name: "quiet-thunder-789--checkpoint:v0"
output_subdir: exp4_ladder_L3_pattern3x3_corner
seed: 42
num_eval_tasks: 96  # same as L0
batch_size: 16  # tasks per jitted call (speed only, not results)
conditions:
  - mean
  - gradient_ascent
  - lora_ascent_decoder
  - lora_ascent_encoder
  - lora_ascent_encoder_decoder
task_generator:  # see src/lpn_exp/task_families.py
  family: pattern
  num_pairs: 4
  num_rows: 4
  num_cols: 4
  pattern_size: 3
  pattern_density: 1.0
  anchor: random_corner
gradient_ascent:
  num_steps: 10
lora:  # shared by all three lora_ascent_* conditions
  rank: 4
  scale: 1.0
  num_steps: 10
# Per-condition learning rates. 0.1 is the paper's own gradient-ascent lr;
# the real runs override these with scripts/tune_exp4_lr.py's tuned values
# (run_exp4.py --learning-rates <sweep dir>/best_learning_rates.json).
learning_rates:
  gradient_ascent: 0.1
  lora_ascent_decoder: 0.1
  lora_ascent_encoder: 0.1
  lora_ascent_encoder_decoder: 0.1
lr_sweep:
  seed: 1  # must differ from `seed`: tuning never sees the evaluation tasks
  num_tasks: 64
  learning_rates: [0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
