experiment: exp1_rank_ablation
description: >
  Fine-tune the same model on the same tasks with LoRA at different ranks
  to see how rank affects quality and parameter efficiency across task
  types (classification, NLI, math). Full fine-tuning is dropped as a
  baseline here for compute cost -- experiment 3 is where it gets a
  direct, controlled comparison against LoRA/adapters/prefix tuning
  instead. Scaled down across the board (fewer ranks, 1 epoch, capped
  SST-2 split, fewer eval samples, shorter classification generations) so
  the full sweep is actually feasible to run on Colab.
model:
  name: qwen2.5-0.5b-instruct
# One model x 3 tasks x 3 LoRA ranks = 9 runs.
tasks:
  - sst2
  - rte
  - gsm8k
output_subdir: exp1_rank_ablation
seed: 42
training:
  epochs: 1
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  max_seq_length: 512
  max_new_tokens: 256
  # sst2/rte only ever output one word; no need to pay GSM8K's
  # multi-step-reasoning generation budget on those.
  max_new_tokens_by_task:
    sst2: 8
    rte: 8
  eval_samples: 50
  # SST-2's train split is ~67k examples -- cap it so this doesn't dominate
  # the sweep's runtime; RTE (~2.5k) and GSM8K (~7.5k) are already smaller
  # than this, so the cap is a no-op for them.
  max_train_samples: 8000
methods:
  - type: lora
    rank: 1
    alpha: 2
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 64
    alpha: 128
    target_modules: [q_proj, v_proj]
