experiment: exp2_matrix_study
description: >
  Fixed LoRA rank (8), sweep which weight matrices LoRA is applied to,
  across all 3 tasks, to see which subsets of the transformer matter most
  for adaptation quality and whether that answer is task-dependent.
  Includes the individual/paired/grouped target-module variants plus the
  4 "leave-one-out from full attention" configs (for the ablation delta
  plot). Full fine-tuning is dropped as a baseline here for compute cost
  -- experiment 3 is where it gets a direct comparison instead -- so the
  heatmap plot shows each config's raw eval accuracy rather than
  normalizing to a full-FT baseline (see scripts/plot_matrix_study_results.py).
model:
  name: qwen2.5-0.5b-instruct
# One model x 3 tasks x 12 LoRA target-module variants = 36 runs.
tasks:
  - sst2
  - rte
  - gsm8k
output_subdir: exp2_matrix_study
seed: 42
training:
  epochs: 1
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  max_seq_length: 512
  max_new_tokens: 256
  max_new_tokens_by_task:
    sst2: 8
    rte: 8
  eval_samples: 50
  max_train_samples: 8000
methods:
  # Individual matrices
  - type: lora  # W_q only
    rank: 8
    alpha: 16
    target_modules: [q_proj]
  - type: lora  # W_k only
    rank: 8
    alpha: 16
    target_modules: [k_proj]
  - type: lora  # W_v only
    rank: 8
    alpha: 16
    target_modules: [v_proj]
  - type: lora  # W_o only
    rank: 8
    alpha: 16
    target_modules: [o_proj]

  # Pairs
  - type: lora  # W_q + W_k
    rank: 8
    alpha: 16
    target_modules: [q_proj, k_proj]
  - type: lora  # W_q + W_v
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj]

  # Grouped
  - type: lora  # all attention (q+k+v+o) -- also the ablation delta plot's baseline
    rank: 8
    alpha: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj]
  - type: lora  # MLP only
    rank: 8
    alpha: 16
    target_modules: [gate_proj, up_proj, down_proj]

  # Leave-one-out from full attention, for the ablation delta plot
  - type: lora  # all attention minus W_q
    rank: 8
    alpha: 16
    target_modules: [k_proj, v_proj, o_proj]
  - type: lora  # all attention minus W_k
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj, o_proj]
  - type: lora  # all attention minus W_v
    rank: 8
    alpha: 16
    target_modules: [q_proj, k_proj, o_proj]
  - type: lora  # all attention minus W_o
    rank: 8
    alpha: 16
    target_modules: [q_proj, k_proj, v_proj]
