experiment: exp1a_rank_ablation
description: >
  Same LoRA-only rank ablation as experiment_1_rank_ablation.yaml (1, 8,
  64), same 3 tasks, split so it can be run one task at a time
  (--task sst2 / --task rte / --task gsm8k) since even the scaled-down
  sweep is easier to run across a few shorter Colab sessions than one
  long one. Every invocation appends to the same metrics.jsonl, so
  plot_results.py still aggregates across all three regardless of how
  many separate sessions it took to produce them.
model:
  name: qwen2.5-0.5b-instruct
# One model x 3 tasks x 3 LoRA ranks = 9 runs, split into 3 per-task
# invocations of 3 runs each (see notebooks/exp1a_rank_ablation.ipynb).
tasks:
  - sst2
  - rte
  - gsm8k
output_subdir: exp1a_rank_ablation
seed: 42
training:
  epochs: 1
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  max_seq_length: 512
  max_new_tokens: 256
  max_new_tokens_by_task:
    sst2: 8
    rte: 8
  eval_samples: 50
  max_train_samples: 8000
methods:
  - type: lora
    rank: 1
    alpha: 2
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 64
    alpha: 128
    target_modules: [q_proj, v_proj]
