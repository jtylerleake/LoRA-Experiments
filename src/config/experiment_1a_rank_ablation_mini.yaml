experiment: exp1a_rank_ablation_mini
description: >
  Tiny smoke-test of experiment 1-A (LoRA-only rank ablation, no full-FT):
  same 3 tasks x 3 ranks, run one task at a time, capped to a handful of
  training examples and 1 epoch per run. Use this to verify the per-task
  --task splitting and cross-invocation metrics aggregation work correctly
  before committing to the full sweep. Accuracy numbers from this config
  are meaningless (barely any training data) — only the wiring matters
  here.
model:
  name: qwen2.5-0.5b-instruct
tasks:
  - sst2
  - rte
  - gsm8k
output_subdir: exp1a_rank_ablation_mini
seed: 42
training:
  epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  max_seq_length: 256
  max_new_tokens: 64
  eval_samples: 8
  max_train_samples: 32
methods:
  - type: lora
    rank: 1
    alpha: 2
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj]
  - type: lora
    rank: 64
    alpha: 128
    target_modules: [q_proj, v_proj]
