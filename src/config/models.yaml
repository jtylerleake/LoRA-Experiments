# Model registry. Add an entry here to make a model available to any
# experiment config via `model.name` — no code changes needed unless the
# model needs bespoke loading logic in models/registry.py.
#
# quantization: null | "4bit" | "8bit" (bitsandbytes), used to fit larger
# models into a single Colab GPU (T4=16GB, L4=24GB, A100=40GB).

qwen2.5-0.5b-instruct:
  repo_id: Qwen/Qwen2.5-0.5B-Instruct
  quantization: null

qwen2.5-1.5b-instruct:
  repo_id: Qwen/Qwen2.5-1.5B-Instruct
  quantization: null

qwen2.5-7b-instruct:
  repo_id: Qwen/Qwen2.5-7B-Instruct
  quantization: null

gpt-oss-20b:
  repo_id: openai/gpt-oss-20b
  quantization: 4bit
