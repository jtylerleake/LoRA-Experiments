experiment: exp4_ladder_L2_pattern3x3_mini
description: >
  Smoke test for exp4_ladder_L2_pattern3x3.yaml (our task generator): same
  checkpoint, conditions and LoRA rank, but a handful of tasks and a couple of
  adaptation steps -- just enough to show the ladder pipeline runs end to end.
checkpoint_repo: clement-bonnet/lpn-2d
checkpoint_name: "quiet-thunder-789--checkpoint:v0"
output_subdir: exp4_ladder_L2_pattern3x3_mini
seed: 42
num_eval_tasks: 4
batch_size: 3  # tasks per jitted call; 3 doesn't divide 4 tasks, so the padded last batch gets exercised too
conditions:
  - mean
  - gradient_ascent
  - lora_ascent_decoder
  - lora_ascent_encoder
  - lora_ascent_encoder_decoder
task_generator:  # L2's family: exercises our generator end to end
  family: pattern
  num_pairs: 4
  num_rows: 4
  num_cols: 4
  pattern_size: 3
  pattern_density: 1.0
  anchor: top_left
gradient_ascent:
  num_steps: 2
lora:  # shared by all three lora_ascent_* conditions
  rank: 4
  scale: 1.0
  num_steps: 2
# Per-condition learning rates. 0.1 is the paper's own gradient-ascent lr;
# the real runs override these with scripts/tune_exp4_lr.py's tuned values
# (run_exp4.py --learning-rates <sweep dir>/best_learning_rates.json).
learning_rates:
  gradient_ascent: 0.1
  lora_ascent_decoder: 0.1
  lora_ascent_encoder: 0.1
  lora_ascent_encoder_decoder: 0.1
lr_sweep:  # tiny, just to show the sweep runs end to end
  seed: 1  # must differ from `seed`: tuning never sees the evaluation tasks
  num_tasks: 4
  learning_rates: [0.01, 0.1, 1.0]
