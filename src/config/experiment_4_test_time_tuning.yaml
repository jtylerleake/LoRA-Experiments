experiment: exp4_test_time_tuning
description: >
  Test-time LoRA adaptation on ARC-AGI-style few-shot tasks: apply a LoRA
  update per task at inference time using its few-shot examples, then
  measure accuracy on the held-out query relative to the unadapted model.
model:
  name: qwen2.5-7b-instruct
tasks: [TODO_arc_agi_style_dataset]
output_subdir: exp4_test_time_tuning
seed: 42
methods:
  - type: lora
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj]
