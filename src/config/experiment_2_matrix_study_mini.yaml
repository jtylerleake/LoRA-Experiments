experiment: exp2_matrix_study_mini
description: >
  Tiny smoke-test of experiment 2: same 3 tasks x 12 LoRA target-module
  variants as experiment_2_matrix_study.yaml, but capped to a handful of
  training examples and 1 epoch per run, so all 36 runs finish in a few
  minutes on a GPU. Use this to verify training, metrics.jsonl, and
  scripts/plot_matrix_study_results.py's heatmap + ablation-delta plots
  all work end-to-end before committing to the full sweep. Accuracy
  numbers from this config are meaningless (barely any training data) —
  only the wiring matters here.
model:
  name: qwen2.5-0.5b-instruct
tasks:
  - sst2
  - rte
  - gsm8k
output_subdir: exp2_matrix_study_mini
seed: 42
training:
  epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  max_seq_length: 256
  max_new_tokens: 64
  eval_samples: 8
  max_train_samples: 32
methods:
  - type: lora  # W_q only
    rank: 8
    alpha: 16
    target_modules: [q_proj]
  - type: lora  # W_k only
    rank: 8
    alpha: 16
    target_modules: [k_proj]
  - type: lora  # W_v only
    rank: 8
    alpha: 16
    target_modules: [v_proj]
  - type: lora  # W_o only
    rank: 8
    alpha: 16
    target_modules: [o_proj]

  - type: lora  # W_q + W_k
    rank: 8
    alpha: 16
    target_modules: [q_proj, k_proj]
  - type: lora  # W_q + W_v
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj]

  - type: lora  # all attention (q+k+v+o) -- also the ablation delta plot's baseline
    rank: 8
    alpha: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj]
  - type: lora  # MLP only
    rank: 8
    alpha: 16
    target_modules: [gate_proj, up_proj, down_proj]

  - type: lora  # all attention minus W_q
    rank: 8
    alpha: 16
    target_modules: [k_proj, v_proj, o_proj]
  - type: lora  # all attention minus W_k
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj, o_proj]
  - type: lora  # all attention minus W_v
    rank: 8
    alpha: 16
    target_modules: [q_proj, k_proj, o_proj]
  - type: lora  # all attention minus W_o
    rank: 8
    alpha: 16
    target_modules: [q_proj, k_proj, v_proj]
