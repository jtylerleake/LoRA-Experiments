experiment: exp3_method_comparison_mini
description: >
  Tiny smoke-test of experiment 3: same 4 methods (full-FT, bottleneck
  adapters, prefix tuning, LoRA) as experiment_3_method_comparison.yaml,
  but capped to a handful of training examples and 1 epoch per run, so all
  4 runs finish in a couple of minutes on a GPU. Accuracy numbers from this
  config are meaningless (barely any training data) — only the wiring
  matters.
model:
  name: qwen2.5-0.5b-instruct
tasks: [sst2]
output_subdir: exp3_method_comparison_mini
seed: 42
training:
  epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  max_seq_length: 256
  max_new_tokens: 64
  eval_samples: 8
  max_train_samples: 32
methods:
  - type: full_ft
    learning_rate: 2.0e-5
  - type: adapters
    bottleneck_size: 64
  - type: prefix_tuning
    num_virtual_tokens: 20
  - type: lora
    rank: 8
    alpha: 16
    target_modules: [q_proj, v_proj]
